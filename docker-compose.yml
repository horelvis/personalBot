# `docker compose up` runs Postgres and personalBot. Sign-in settings come from .env (see .env.example).
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: personalbot
      POSTGRES_PASSWORD: personalbot
      POSTGRES_DB: personalbot
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U personalbot"]
      interval: 5s
      retries: 10

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgres://personalbot:personalbot@postgres:5432/personalbot
    ports:
      - "3001:3001"
    restart: unless-stopped

volumes:
  postgres-data:
