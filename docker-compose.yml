services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: personalbot
      POSTGRES_PASSWORD: personalbot
      POSTGRES_DB: personalbot
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U personalbot"]
      interval: 5s
      retries: 10

volumes:
  postgres-data:
